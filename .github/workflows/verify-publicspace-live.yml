name: Verify deployed PublicSpace gallery
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/verify-publicspace-live.yml'
      - 'scripts/verify_publicspace_live.py'
      - 'data/publicspace-manifest.json'
      - 'assets/app.js'
      - 'assets/archive-taxonomy.js'
      - 'scripts/test_archive_taxonomy.cjs'
      - 'index.html'

permissions:
  contents: read

concurrency:
  group: publicspace-live-check
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify classification evidence and pending scopes
        run: node scripts/test_archive_taxonomy.cjs
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verify Pages endpoints, official image URLs and live gallery
        run: python scripts/verify_publicspace_live.py
