name: Prepare reviewed November 21 images
on:
  push:
    branches: ['daily/2026-11-21']
    paths:
      - 'review/20261121-image-sources.json'
      - 'scripts/cache_daily_20261121.py'
      - '.github/workflows/prepare-20261121-images.yml'
permissions:
  contents: write
concurrency:
  group: prepare-november-21-images
  cancel-in-progress: false
jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - name: Fetch and decode all reviewed image sources
        run: python scripts/cache_daily_20261121.py
      - name: Save reviewed image assets on preparation branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/images/daily-20261121 review/20261121-image-download-validation.json
          git diff --cached --quiet || git commit -m 'Cache thirty decoded November 21 research images with source audit'
          git push origin HEAD:daily/2026-11-21
