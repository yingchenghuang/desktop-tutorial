name: Audit Kunst am Bau artwork photo links
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/audit-kab-image-links.py'
      - '.github/workflows/audit-kab-images.yml'
permissions:
  contents: write
concurrency:
  group: audit-kab-images
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - name: Check 407 image URLs, research 58 gaps
        run: python scripts/audit-kab-image-links.py
      - name: Commit audit for review without automatically assigning unrelated artwork photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add review/kab-image-audit-20261118.json
          if ! git diff --cached --quiet; then
            git commit -m "Audit original artwork photo URLs and candidate image licenses"
            for attempt in 1 2 3 4; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep 3
            done
            exit 1
          fi
