name: Verify Kunst am Bau independent archive
on:
  workflow_dispatch:
  push:
    paths:
      - 'kunst-am-bau/**'
      - 'data/kunst-am-bau-60-special-20261118.json'
      - 'data/kunst-am-bau-70-special-20261118.json'
      - 'data/museum-1000-orte-catalog.json'
      - 'data/museum-1000-orte-home-snapshot-20261118.json'
      - '.github/workflows/verify-kunst-am-bau.yml'
permissions:
  contents: read
concurrency:
  group: verify-kunst-am-bau
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: JavaScript syntax check
        run: node --check kunst-am-bau/app.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Browser test dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Validate independent collection in a local browser
        run: |
          python -m http.server 8787 --directory . >/tmp/kab-http.log 2>&1 &
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          import json
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=["--no-sandbox"])
              page=browser.new_page(viewport={"width":1366,"height":900})
              errors=[]
              page.on('pageerror',lambda error:errors.append(str(error)))
              page.goto("http://127.0.0.1:8787/kunst-am-bau/",wait_until="domcontentloaded",timeout=30000)
              page.wait_for_function("document.querySelector('#statTotal').textContent.trim() !== '…'",timeout=60000)
              total=int(page.locator("#statTotal").inner_text().replace(",",""))
              official=int(page.locator("#statOfficial").inner_text().replace(",",""))
              photoCount=int(page.locator("#statImages").inner_text().replace(",",""))
              assert photoCount>=100,("linked artwork photo count",photoCount)
              assert total >=175,(total,official)
              assert official >= 101,(total,official)
              assert page.locator(".work-card").count()>=20
              page.locator("#srcFilter").select_option("2010")
              page.wait_for_timeout(500)
              c60=int(page.locator("#filteredCount").inner_text().replace(",",""))
              assert c60==60,('60th',c60)
              page.locator("#srcFilter").select_option("2020")
              page.wait_for_timeout(500)
              c70=int(page.locator("#filteredCount").inner_text().replace(",",""))
              assert c70==59,('70th',c70)
              page.locator("#srcFilter").select_option("museum")
              page.wait_for_timeout(500)
              museum=int(page.locator("#filteredCount").inner_text().replace(",",""))
              assert museum>=101,('museum',museum)
              page.locator(".work-card").first.click()
              assert page.locator("#detailOverlay").is_visible()
              assert page.locator(".detail-links a").count()>=1
              page.locator("#detailClose").click()
              assert not page.locator("#detailOverlay").is_visible()
              page.set_viewport_size({"width":390,"height":844})
              page.reload(wait_until="domcontentloaded")
              page.wait_for_function("document.querySelector('#statTotal').textContent.trim() !== '…'",timeout=60000)
              assert page.locator("#worksGrid").is_visible()
              assert not errors,errors[:5]
              print(json.dumps({"total":total,"museum":official,"images":photoCount,"60th":c60,"70th":c70,"museumFilter":museum,"browserErrors":errors},ensure_ascii=False))
              browser.close()
          PY
