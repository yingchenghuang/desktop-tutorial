name: Import Museum der 1000 Orte artwork catalog
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/import_museum_1000_orte.py'
      - '.github/workflows/import-museum-1000-orte.yml'
permissions:
  contents: write
concurrency:
  group: museum-1000-orte-import
  cancel-in-progress: false
jobs:
  source-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install crawler parser
        run: python -m pip install requests beautifulsoup4
      - name: Read work index and artwork pages from the official source
        run: python scripts/import_museum_1000_orte.py
      - name: Validate complete official work registry
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("data/museum-1000-orte-catalog.json").read_text())
          manifest=json.loads(Path("data/museum-1000-orte-manifest.json").read_text())
          items=data["entries"]
          assert len(data["sourceRecords"])>=300
          assert len(items)>0
          assert len(items)+len(data["crossReferences"])==len(data["sourceRecords"])
          assert len(items)==len(set(i["dedupeKey"] for i in items))
          assert len(items)==manifest["expectedEntries"]
          assert len({x["officialUrl"] for x in data["sourceRecords"]})==len(data["sourceRecords"])
          assert all(i.get("workPage","").startswith("https://www.museum-der-1000-orte.de/kunstwerke/kunstwerk/") for i in items)
          print("VERIFIED",len(data["sourceRecords"]),"UNIQUE",len(items),"LINKED",len(data["crossReferences"]))
          PY
      - name: Commit research catalog without touching homepage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/museum-1000-orte-catalog.json data/museum-1000-orte-manifest.json review/museum-1000-orte-audit.json
          if ! git diff --cached --quiet; then
            git commit -m "Index Museum der 1000 Orte official works and source links"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                exit 0
              fi
              sleep 4
            done
            echo "Remote changed during import" >&2
            exit 1
          fi
